name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,rpm,appimage
            artifact: vent-linux
            files: |
              target/release/bundle/deb/*.deb
              target/release/bundle/rpm/*.rpm
              target/release/bundle/appimage/*.AppImage
          - os: windows-latest
            bundles: msi,nsis
            artifact: vent-windows
            files: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Engine parity tests
        run: cargo test -p engine

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build bundles
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: ${{ matrix.files }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: VENT ${{ github.ref_name }}
          body: |
            ## Tải và cài đặt trên Windows

            1. Trong mục **Assets** bên dưới, bấm tệp `VENT_*_x64-setup.exe`.
            2. Mở tệp vừa tải. Nếu Windows hiện "Windows protected your PC", bấm **More info** → **Run anyway**.
            3. Cài đặt rồi mở **VENT** từ Start Menu.

            Yêu cầu Windows 10/11 64-bit. Không cần mã truy cập; app chạy offline sau khi cài.
            Gói `.msi` dành cho quản trị viên hệ thống. Hướng dẫn chi tiết: https://github.com/lastnight030506/dh-vent-clone/blob/main/docs/INSTALL-WINDOWS.md

            ## Install on Windows

            1. Under **Assets**, click `VENT_*_x64-setup.exe`.
            2. Open the file. If SmartScreen appears, click **More info** → **Run anyway**.
            3. Install and launch **VENT** from the Start Menu.

            Requires Windows 10/11 64-bit. No access code; works offline after install.
          files: |
            dist/**/*.exe
            dist/**/*.msi
            dist/**/*.deb
            dist/**/*.rpm
            dist/**/*.AppImage
          fail_on_unmatched_files: true
